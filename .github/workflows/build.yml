name: Build GardenSociety

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GardenSociety
        uses: actions/checkout@v4
        with:
          path: plugin
      - name: Checkout GardenCore
        uses: actions/checkout@v4
        with:
          repository: Heras-Garden/GardenCore
          path: GardenCore
      - name: Checkout GardenTrade
        uses: actions/checkout@v4
        with:
          repository: Heras-Garden/GardenTrade
          path: GardenTrade
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install GardenCore
        run: mvn -B -f GardenCore/pom.xml install -DskipTests
      - name: Install GardenTrade
        run: mvn -B -f GardenTrade/pom.xml install -DskipTests
      - name: Build GardenSociety
        run: mvn -B -f plugin/pom.xml package -DskipTests
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: GardenSociety
          path: plugin/target/GardenSociety-*.jar
